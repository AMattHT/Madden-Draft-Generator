name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (server)
        run: cd server && npm ci
      - name: Install (web)
        run: cd web && npm ci
      - name: Typecheck server
        run: cd server && npx tsc --noEmit
      - name: Typecheck web
        run: cd web && npx tsc --noEmit
      # Unit tests that need only the repo (lookups, calibration, templates). The
      # golden tests that read the nflverse cache and the game Saves folders are
      # skipped when those are absent (see CI_SKIP_DATA in the test files).
      - name: Unit tests
        run: cd server && CI_SKIP_DATA=1 npm test
